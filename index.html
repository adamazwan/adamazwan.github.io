<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adam Azwan | Network Engineer</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background:
        radial-gradient(circle at top, #172033 0%, #0b0f14 45%, #070a0e 100%);
      color: #e6edf3;
      font-family: Arial, Helvetica, sans-serif;
    }

    .profile-card {
      width: 100%;
      max-width: 560px;
      padding: 48px;
      text-align: center;
      background: rgba(17, 24, 32, 0.95);
      border: 1px solid #263442;
      border-radius: 20px;
      box-shadow: 0 25px 70px rgba(0, 0, 0, 0.5);
    }

    .avatar {
      width: 90px;
      height: 90px;
      margin: 0 auto 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: #182536;
      border: 2px solid #3b82f6;
      color: #60a5fa;
      font-size: 30px;
      font-weight: 700;
    }

    h1 {
      margin-bottom: 8px;
      font-size: 30px;
      letter-spacing: -0.5px;
    }

    .role {
      margin-bottom: 28px;
      color: #60a5fa;
      font-size: 17px;
      font-weight: 600;
    }

    .bio {
      margin-bottom: 28px;
      color: #9aa7b4;
      line-height: 1.7;
      font-size: 15px;
    }

    .skills {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-bottom: 30px;
    }

    .skill {
      padding: 9px 14px;
      border-radius: 8px;
      background: #18232e;
      border: 1px solid #2a3a49;
      color: #cbd5e1;
      font-size: 14px;
    }

    .fact {
      padding-top: 24px;
      border-top: 1px solid #263442;
      color: #8b98a6;
      font-size: 14px;
      line-height: 1.6;
    }

    .fact strong {
      color: #e6edf3;
    }

    @media (max-width: 480px) {
      .profile-card {
        padding: 36px 24px;
      }

      h1 {
        font-size: 25px;
      }
    }
  </style>
</head>

<body>
  <main class="profile-card">
    <div class="avatar">AA</div>

    <h1>Adam Azwan bin Abdul Wahab</h1>

    <p class="role">Network Engineer</p>

    <p class="bio">
      Network Engineer yang berminat dalam teknologi rangkaian,
      infrastruktur, dan penyelesaian masalah teknikal.
    </p>

    <div class="skills">
      <span class="skill">Linux</span>
      <span class="skill">Git</span>
      <span class="skill">IP</span>
      <span class="skill">MPLS</span>
      <span class="skill">L2VPN</span>
    </div>

    <p class="fact">
      <strong>Fakta menarik:</strong> Berperwatakan menarik.
    </p>
  </main>
</body>
</html>
